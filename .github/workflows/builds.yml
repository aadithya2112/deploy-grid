name: Deployment builds
on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: deploy-grid-builds
  cancel-in-progress: false
jobs:
  build:
    if: vars.DEPLOY_GRID_BUILDS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - name: Install supervisor dependencies
        working-directory: worker
        run: bun install --frozen-lockfile
      - name: Build restricted runner image
        run: docker build -f worker/Dockerfile.build -t deploy-grid-builder:local worker
      - name: Block build-container access to private networks and metadata
        run: bash worker/scripts/restrict-build-network.sh
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/deploy-grid/cache
          key: ${{ runner.os }}-dg-${{ hashFiles('worker/Dockerfile.build') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-dg-${{ hashFiles('worker/Dockerfile.build') }}-
      - name: Drain queued deployments and recover interrupted builds
        working-directory: worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          PROJECT_ENV_ENCRYPTION_KEY: ${{ secrets.PROJECT_ENV_ENCRYPTION_KEY }}
          ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
          ARTIFACT_ACCESS_KEY: ${{ secrets.ARTIFACT_ACCESS_KEY }}
          ARTIFACT_SECRET_KEY: ${{ secrets.ARTIFACT_SECRET_KEY }}
          R2_S3_ENDPOINT: ${{ secrets.R2_S3_ENDPOINT }}
          ARTIFACT_BASE_URL: ${{ vars.ARTIFACT_BASE_URL }}
          GITHUB_APP_ID: ${{ vars.GITHUB_APP_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GITHUB_APP_PRIVATE_KEY }}
          WORKER_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
          WORKER_TMP_DIR: ${{ runner.temp }}/deploy-grid
        run: bun index.ts --once
