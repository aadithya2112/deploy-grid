name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploy_grid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d deploy_grid_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/deploy_grid_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run migrations
        run: bun run db:migrate
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Test
        run: bun run test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium
      - name: Typecheck
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: E2E tests
        run: bun run test:e2e

  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: deploy_grid_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d deploy_grid_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/deploy_grid_test
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4
      - run: bun install --frozen-lockfile
        working-directory: api
      - run: bun install --frozen-lockfile
        working-directory: worker
      - run: bun install --frozen-lockfile
        working-directory: edge
      - run: bun run db:migrate
        working-directory: api
      - run: bunx wrangler deploy --dry-run --outdir dist
        working-directory: api
      - run: bun run typecheck && bun test && bunx wrangler deploy --dry-run --outdir dist
        working-directory: edge
      - run: node test/runtime-smoke.mjs
        working-directory: edge
      - run: docker build -f worker/Dockerfile.build -t deploy-grid-builder:local worker
      - run: bun worker/scripts/network-smoke.ts reachable
      - run: bash worker/scripts/restrict-build-network.sh
      - run: bun worker/scripts/network-smoke.ts blocked
      - run: bun scripts/isolation-smoke.ts && bun scripts/framework-smoke.ts && bun scripts/lifecycle-smoke.ts
        working-directory: worker
